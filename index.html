<head>

<title>7차시 데이터 쁘띠바크</title>

<style>
:root{--blue:rgb(0,111,211);--ink:#111;--muted:#68727d;--bg:#f3f5f7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea{font:inherit}.hidden{display:none!important}button{cursor:pointer}
#view{min-height:100vh;padding:18px 14px 36px}.setup{max-width:760px;margin:22px auto;background:#fff;border:1px solid #d7dde4;border-radius:12px;padding:24px;box-shadow:0 5px 18px rgba(0,0,0,.05)}.setup h1{font-size:26px;margin:0 0 8px}.setup p{margin:0 0 20px;color:var(--muted)}.api-warning{padding:10px 12px;background:#fff4f2;border:1px solid #efc4bd;color:#a52c20;border-radius:7px;margin-bottom:18px;font-size:13px}.period-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:1px solid #c5ced8;background:#fff;color:#111;border-radius:8px;padding:11px 15px;font-weight:700;min-height:44px}.btn:hover{border-color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.subtle{background:#f8fafb}.btn:disabled{opacity:.45;cursor:not-allowed}.choice-row{display:flex;gap:10px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;height:44px;border:1px solid #b9c3ce;border-radius:7px;padding:0 11px}.code-input{text-align:center;font-size:26px;font-weight:800;letter-spacing:7px}.entry-msg{font-size:13px;margin-left:8px;color:#5a6470}
.sessionbar{width:724px;margin:0 auto 10px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.session-left{display:flex;align-items:center;justify-content:flex-start}.session-center{display:flex;align-items:center;justify-content:center}.session-right{display:flex;gap:8px;align-items:center;justify-content:flex-end}.chip{background:#fff;border:1px solid #cfd6de;border-radius:999px;padding:6px 10px;font-size:12px}.session-main{font-size:14px;font-weight:800}.group-code-chip{border:2px solid var(--blue);color:#063c70;padding:6px 12px;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;line-height:1}.group-code-chip b{font-size:22px;letter-spacing:3px;margin-left:6px;line-height:1;display:inline-block}.conn{font-size:12px;color:#68727d}.conn.ok{color:#17673b}.conn.warn{color:#9a6512}
.round-banner{width:724px;margin:0 auto 10px;background:#fff;border:1px solid #ccd4dc;border-radius:8px;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;color:var(--blue);font-weight:800}.round-banner b{font-size:15px;color:var(--blue);font-weight:800}.round-banner .hint{color:var(--blue);font-weight:800}.round-banner .hint.guide{color:var(--blue);font-weight:800}
.paper-scroll{overflow-x:auto;padding-bottom:8px}.paper{width:724px;min-height:1024px;margin:0 auto;background:#fff;color:#000;position:relative;padding-top:70px;padding-bottom:60px;box-shadow:0 3px 18px rgba(0,0,0,.08)}
.paper-header{width:644px;height:88px;margin:0 auto 22px;border:4px double #686868;display:grid;grid-template-columns:174px 265px minmax(0,1fr);align-items:center;padding:5px 11px 5px 8px;column-gap:8px}.head-left{display:flex;align-items:center;gap:10px}.logo{width:54px;height:auto;display:block}.lesson{font-family:Dotum,"돋움","Malgun Gothic",sans-serif;font-weight:700;font-size:22px;white-space:nowrap}.title{font-family:Dotum,"돋움","Malgun Gothic",sans-serif;font-weight:800;font-size:23px;text-align:center;white-space:nowrap}.student-info{width:100%;font-family:Dotum,"돋움","Malgun Gothic",sans-serif;font-size:10px;line-height:1.2;display:grid;grid-template-rows:repeat(3,16px);row-gap:5px}.info-line{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;column-gap:5px;white-space:nowrap}.info-line.double{grid-template-columns:44px minmax(0,1fr) 20px minmax(0,1fr);column-gap:5px}.info-label{text-align:right;font-weight:700}.info-value{display:block;width:100%;height:16px;border-bottom:1px solid #222;text-align:center;padding:1px 2px 0;overflow:hidden;text-overflow:ellipsis}
.sheet-table{width:644px;margin:0 auto;border-collapse:collapse;table-layout:fixed;border:2px solid #111;font-family:"HY수평선B","Malgun Gothic","Apple SD Gothic Neo",sans-serif}.sheet-table th,.sheet-table td{border:1px solid #1d1d1d;padding:0;text-align:center;vertical-align:middle}.sheet-table thead th{height:45px;font-size:16px;font-weight:800;line-height:1.35}.sheet-table tbody td{height:101px;font-size:20px;font-weight:700}.c-no{width:58px}.c-prompt{width:92px}.c-sound{width:102px}.c-text{width:102px}.c-num{width:102px}.c-img{width:106px}.c-score{width:82px}.subhead{display:block;font-size:13px}.row-no{font-size:16px!important}.future{background:#fff}.current{background:#fff}.past{background:#fff}
.cell-editor{position:relative;width:100%;min-height:100px;display:flex;align-items:center;justify-content:center;padding:7px 6px}.cell-editor textarea{width:100%;min-height:32px;border:0;outline:0;resize:none;overflow:hidden;background:transparent;text-align:center;padding:3px 4px;font:700 20px/1.45 "HY수평선B","Malgun Gothic",sans-serif}.score-input{width:100%;min-height:38px;border:0;outline:0;background:transparent;text-align:center;padding:4px 2px;font:700 21px/1.3 "HY수평선B","Malgun Gothic",sans-serif}.cell-editor textarea::placeholder{color:#111;opacity:.26}.cell-text{width:100%;min-height:99px;padding:8px 6px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;word-break:break-word;line-height:1.45}.lock-note{position:absolute;left:4px;right:4px;bottom:3px;padding:2px 4px;background:#fff4d8;border:1px solid #e3c56f;border-radius:3px;font:600 10px/1.25 "Malgun Gothic",sans-serif;color:#725700}.save-dot{position:absolute;right:4px;bottom:4px;font:600 9px/1 "Malgun Gothic",sans-serif;color:#76808a}.save-dot.saving{color:#9a6512}.save-dot.saved{color:#1c6f42}
.image-editor{position:relative;min-height:100px;width:100%;overflow:hidden}.draw-canvas{display:block;width:100%;height:100px;touch-action:none;background:transparent}.draw-clear{position:absolute;right:3px;top:3px;border:1px solid #bfc5ca;background:#fff;border-radius:4px;padding:3px 5px;font:600 10px "Malgun Gothic",sans-serif}.drawing-svg{width:100%;height:98px;display:block}.score-editor{position:relative;padding:5px 4px}.score-confirm{width:100%;margin-top:4px;border:1px solid #b22f2f;background:#d94848;color:#fff;border-radius:5px;padding:5px 2px;font:800 10px/1.15 "Malgun Gothic",sans-serif;white-space:nowrap}.score-confirm.done{background:#fff;color:#17673b;border-color:#7eb995}.score-confirm:disabled{opacity:.62}.example-chair{width:77px;height:72px;object-fit:contain;opacity:1}.row-data-btn{width:70px;min-height:54px;padding:6px 4px;border-radius:7px;font-size:16px;line-height:1.1;background:#d94848!important;border-color:#b52f2f!important;color:#fff!important}.row-data-btn:disabled{background:#e6aaaa!important;border-color:#d5a0a0!important;color:#fff!important}.example-cell{color:#111;flex-direction:column;line-height:1.35}.example-sub{color:#777;font-weight:700;font-size:15px;display:block;margin-top:3px;white-space:nowrap}
.stop-banner{max-width:724px;margin:10px auto 0;background:#fff7df;border:1px solid #e2c36c;border-radius:7px;padding:10px 12px;text-align:center;font-weight:800}.progress-line{max-width:724px;margin:8px auto 0;text-align:center;font-size:12px;color:#5d6872}.actions{max-width:724px;margin:12px auto 0;display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}.action-msg{font-size:12px;color:#5f6973}.final-note{max-width:724px;margin:0 auto 10px;text-align:center;font-weight:800;color:#1d633b}.capture-mode .draw-clear,.capture-mode .lock-note,.capture-mode .save-dot,.capture-mode .score-confirm{display:none!important}

const STORAGE_KEY='pb7_v2_student_session';
const state={mode:'',period:0,sessionId:'',groupCode:'',participantId:'',studentName:'',session:null,group:null,round:null,drawing:{strokes:[],seq:0},drawingBackup:{},history:{},scoreProgress:null,pollTimer:null,pollBusy:false,debounce:{},saveRetry:{},dirtyFields:{},seq:{prompt:0,sound:0,text:0,number:0,image:0,score:0},drawingDirty:false,drawingPointer:false,imageLockUntil:0,imageLockPromise:null,lastRound:0,lastStatus:'',connection:'',viewReady:false};
const view=document.getElementById('view');

function kstDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function makeSessionId(p){return `${kstDate()}_${p}교시`}
function apiConfigured(){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(CONFIG.API_URL)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function jitter(ms){return Math.max(700,ms+Math.floor(Math.random()*600)-300)}
function val(id){return (document.getElementById(id)?.value||'').trim()}
function safeName(s){return String(s).replace(/[\\/:*?"<>|#%{}~&]/g,'_')}
function saveLocal(){if(!state.sessionId||!state.groupCode||!state.participantId)return;localStorage.setItem(STORAGE_KEY,JSON.stringify({date:kstDate(),period:state.period,sessionId:state.sessionId,groupCode:state.groupCode,participantId:state.participantId,studentName:state.studentName}))}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');return x&&x.date===kstDate()?x:null}catch{return null}}
function clearLocal(){localStorage.removeItem(STORAGE_KEY)}

async function callApi(payload,{timeout=CONFIG.REQUEST_TIMEOUT_MS,retries=0}={}){
  if(!apiConfigured())throw new Error('Apps Script 배포 주소가 설정되지 않았습니다.');
  let lastErr;
  for(let attempt=0;attempt<=retries;attempt++){
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);
    try{
      const res=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:controller.signal,cache:'no-store'});
      if(!res.ok)throw new Error('서버 응답 오류');
      const data=await res.json();clearTimeout(timer);return data;
    }catch(e){clearTimeout(timer);lastErr=e;if(attempt<retries)await sleep(350+attempt*250)}
  }
  throw lastErr||new Error('연결 오류');
}

function setConn(msg,kind=''){state.connection=msg;const el=document.getElementById('conn');if(el){el.textContent=msg;el.className='conn '+kind}}
function showStart(){stopPolling();state.mode='start';state.viewReady=false;view.innerHTML=`<section class="setup"><h1>7차시 데이터 쁘띠바크</h1><p>오늘 수업 교시를 선택하세요.</p>${apiConfigured()?'':`<div class="api-warning">Apps Script 배포 URL이 아직 설정되지 않았습니다. index.html의 CONFIG.API_URL에 새 쁘띠바크 /exec 주소를 넣어 주세요.</div>`}<div class="period-grid">${[1,2,3,4,5,6].map(p=>`<button class="btn" data-period="${p}">${p}교시</button>`).join('')}</div></section>`;view.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>showEntry(Number(b.dataset.period)))}
function showEntry(period){stopPolling();state.mode='entry';state.period=period;state.sessionId=makeSessionId(period);view.innerHTML=`<section class="setup"><h1>${period}교시</h1><p>새 모둠을 만들거나 친구가 알려준 4자리 모둠 코드로 참여하세요.</p><div class="choice-row"><button class="btn primary" id="makeBtn">새 모둠 만들기</button><button class="btn" id="joinBtn">모둠 코드로 참여하기</button><button class="btn subtle" id="backBtn">교시 다시 선택</button></div><div id="entryBox" style="margin-top:18px"></div></section>`;document.getElementById('makeBtn').onclick=showCreateForm;document.getElementById('joinBtn').onclick=showJoinForm;document.getElementById('backBtn').onclick=showStart}
function showCreateForm(){document.getElementById('entryBox').innerHTML=`<div class="form-grid"><div class="field"><label>초등학교</label><input id="school" placeholder="예: ○○초등학교"></div><div class="field"><label>학년</label><input id="grade" inputmode="numeric" placeholder="예: 5"></div><div class="field"><label>반</label><input id="className" inputmode="numeric" placeholder="예: 2"></div><div class="field"><label>모둠</label><input id="groupName" placeholder="예: 1모둠"></div><div class="field"><label>내 이름</label><input id="studentName" placeholder="이름"></div></div><div style="margin-top:14px"><button class="btn primary" id="createGo">모둠 만들기</button><span class="entry-msg" id="entryMsg"></span></div>`;document.getElementById('createGo').onclick=createGroup}
function showJoinForm(){document.getElementById('entryBox').innerHTML=`<div class="form-grid"><div class="field"><label>4자리 모둠 코드</label><input id="joinCode" class="code-input" inputmode="numeric" maxlength="4" placeholder="0000"></div><div class="field"><label>내 이름</label><input id="studentName" placeholder="이름"></div></div><div style="margin-top:14px"><button class="btn primary" id="joinGo">참여하기</button><span class="entry-msg" id="entryMsg"></span></div>`;document.getElementById('joinGo').onclick=joinGroup;['joinCode','studentName'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')joinGroup()}))}
async function createGroup(){const msg=document.getElementById('entryMsg'),btn=document.getElementById('createGo');btn.disabled=true;msg.textContent='모둠을 만들고 있습니다...';try{const studentName=val('studentName'),payload={action:'createGroup',sessionId:state.sessionId,school:val('school'),grade:val('grade'),className:val('className'),groupName:val('groupName'),studentName};let r=await callApi(payload,{retries:1});if(!r.ok&&String(r.message||'').includes('활동 시작 단계에서만')){await sleep(350);r=await callApi(payload,{retries:0})}if(!r.ok){msg.textContent=r.message||'모둠을 만들지 못했습니다.';btn.disabled=false;return}msg.textContent='';state.groupCode=r.code;state.participantId=r.participantId;state.studentName=studentName;state.session=r.session;state.group=r.group;saveLocal();await enterWorksheet()}catch(e){msg.textContent='연결하지 못했습니다. 인터넷 상태와 배포 주소를 확인해 주세요.';btn.disabled=false}}
async function joinGroup(){const msg=document.getElementById('entryMsg'),btn=document.getElementById('joinGo');btn.disabled=true;msg.textContent='모둠에 참여하고 있습니다...';try{const studentName=val('studentName'),code=val('joinCode').replace(/\D/g,'').slice(0,4);const r=await callApi({action:'joinGroup',sessionId:state.sessionId,code,studentName},{retries:1});if(!r.ok){msg.textContent=r.message||'모둠에 참여하지 못했습니다.';btn.disabled=false;return}state.groupCode=r.code;state.participantId=r.participantId;state.studentName=studentName;state.session=r.session;state.group=r.group;saveLocal();await enterWorksheet()}catch(e){msg.textContent='연결하지 못했습니다. 잠시 후 다시 시도해 주세요.';btn.disabled=false}}

async function resumeLocal(x){state.mode='student';state.period=x.period;state.sessionId=x.sessionId;state.groupCode=x.groupCode;state.participantId=x.participantId;state.studentName=x.studentName||'';try{const r=await callApi({action:'getState',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId},{retries:1});if(!r.ok){clearLocal();showStart();return}applyState(r);await loadHistory();renderWorksheet(true);startPolling()}catch{showStart()}}
async function enterWorksheet(){state.mode='student';const r=await callApi({action:'getState',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId},{retries:1});if(!r.ok)throw new Error(r.message||'상태를 불러오지 못했습니다.');applyState(r);await loadHistory();renderWorksheet(true);startPolling()}
function applyState(r){const prevRound=state.session?.round||0,prevDrawing=state.drawing||{strokes:[],seq:0};if(prevRound&&(prevDrawing.strokes||[]).length)state.drawingBackup[prevRound]=JSON.parse(JSON.stringify(prevDrawing));state.lastRound=prevRound;state.lastStatus=state.session?.status||'';state.session=r.session;state.group=r.group;state.round=r.round;const incoming=r.drawing||{strokes:[],seq:0},roundNo=state.session?.round||0;if((incoming.strokes||[]).length){state.drawing=incoming;if(roundNo)state.drawingBackup[roundNo]=JSON.parse(JSON.stringify(incoming))}else if(roundNo&&state.drawingBackup[roundNo]&&(state.drawingBackup[roundNo].strokes||[]).length){state.drawing=JSON.parse(JSON.stringify(state.drawingBackup[roundNo]))}else state.drawing=incoming;state.scoreProgress=r.scoreProgress||null;['prompt','sound','text','number','score'].forEach(f=>state.seq[f]=Math.max(Number(state.seq[f]||0),Number(state.round?.seq?.[f]||0)));state.seq.image=Math.max(Number(state.seq.image||0),Number(state.drawing.seq||0))}
async function loadHistory(){try{const r=await callApi({action:'getHistory',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId,upTo:7},{retries:2});if(!r.ok)return false;state.history={};(r.rounds||[]).forEach(x=>{const n=x.round.round,incoming=x.drawing||{strokes:[]};let drawing=incoming;if((incoming.strokes||[]).length){state.drawingBackup[n]=JSON.parse(JSON.stringify(incoming))}else if(state.drawingBackup[n]&&(state.drawingBackup[n].strokes||[]).length){drawing=JSON.parse(JSON.stringify(state.drawingBackup[n]))}state.history[n]={...x.round,drawing}});return Object.keys(state.history).length>=7}catch{return false}}

function headerHtml(){const g=state.group||{};return `<div class="paper-header"><div class="head-left"><img src="${ASSET.logo}" class="logo" alt="SW미래채움"><span class="lesson">7차시</span></div><div class="title">데이터 쁘띠바크</div><div class="student-info"><div class="info-line"><span class="info-label">초등학교</span><span class="info-value">${esc(g.school||'')}</span></div><div class="info-line double"><span class="info-label">학년</span><span class="info-value">${esc(g.grade||'')}</span><span class="info-label">반</span><span class="info-value">${esc(g.className||'')}</span></div><div class="info-line"><span class="info-label">모둠</span><span class="info-value">${esc(g.groupName||'')}</span></div></div></div>`}
function tableHead(){return `<thead><tr><th class="c-no">라운드</th><th class="c-prompt">제시어</th><th class="c-sound">소리 데이터</th><th class="c-text">문자 데이터</th><th class="c-num">숫자 데이터<span class="subhead">(관련된 숫자)</span></th><th class="c-img">이미지 데이터<span class="subhead">(간단한 그림)</span></th><th class="c-score">점수</th></tr></thead>`}
function placeholderFor(n,f){if(n!==1)return'';return({prompt:'의자',sound:'드르륵\n(의자끄는\n소리)',text:'등받이',number:'4\n(의자\n다리 수)'}[f]||'')}
function roundData(n){if(state.session&&n===state.session.round)return{...(state.round||{}),drawing:state.drawing};return state.history[n]||{round:n,prompt:'',sound:'',text:'',number:'',score:'',imageCompleted:false,scoreConfirmed:false,drawing:{strokes:[]}}}
function lockOwner(field){const l=state.round?.locks?.[field];return l&&l.participantId!==state.participantId?l.ownerName||'다른 모둠원':''}
function textDisplay(value){return `<div class="cell-text">${esc(value||'')}</div>`}
function drawingSvg(strokes){const lines=(strokes||[]).map(s=>{const pts=(s.points||[]).map(p=>`${Number(p.x||0).toFixed(1)},${Number(p.y||0).toFixed(1)}`).join(' ');return pts?`<polyline points="${pts}" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}).join('');return `<svg class="drawing-svg" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>`}
function cellEditor(field,n,data){const owner=lockOwner(field);const placeholder=placeholderFor(n,field);return `<div class="cell-editor"><textarea id="f-${field}" data-field="${field}" placeholder="${esc(placeholder)}">${esc(data[field]||'')}</textarea>${owner?`<span class="lock-note">${esc(owner)} 작성 중</span>`:''}<span class="save-dot" id="save-${field}"></span></div>`}
function imageEditor(n,data){const owner=lockOwner('image');return `<div class="image-editor"><canvas id="drawCanvas" class="draw-canvas" width="112" height="100"></canvas><button class="draw-clear" id="drawClear">전체 지우기</button>${owner?`<span class="lock-note">${esc(owner)} 작성 중</span>`:''}<span class="save-dot" id="save-image"></span></div>`}
function scoreEditor(data){const owner=lockOwner('score');return `<div class="score-editor"><input id="scoreInput" class="score-input" inputmode="decimal" value="${esc(data.score||'')}" ${data.scoreConfirmed?'disabled':''}>${owner?`<span class="lock-note">${esc(owner)} 입력 중</span>`:''}<button class="score-confirm ${data.scoreConfirmed?'done':''}" id="scoreConfirm" ${data.scoreConfirmed?'disabled':''}>${data.scoreConfirmed?'점수 확정 완료':'점수 확정'}</button><span class="save-dot" id="save-score"></span></div>`}
function displayRow(n,data){if(n===1)return `<tr class="example-row"><td class="row-no">예시</td><td><div class="cell-text example-cell">의자</div></td><td><div class="cell-text example-cell">드르륵<span class="example-sub">(의자 끄는<br>소리)</span></div></td><td><div class="cell-text example-cell">등받이</div></td><td><div class="cell-text example-cell">4<span class="example-sub">(의자<br>다리 수)</span></div></td><td><img class="example-chair" src="${ASSET.chair}" alt="의자 예시"></td><td><div class="cell-text example-cell">2</div></td></tr>`;const cur=state.session&&n===state.session.round;const past=state.session&&n<state.session.round;const future=state.session&&n>state.session.round;const editing=cur&&state.session.status==='writing';const scoring=cur&&state.session.status==='stopped';const d=data.drawing||{strokes:[]};return `<tr class="${cur?'current':past?'past':'future'}"><td class="row-no">${n-1}</td><td>${editing?cellEditor('prompt',n,data):textDisplay(data.prompt)}</td><td>${editing?cellEditor('sound',n,data):textDisplay(data.sound)}</td><td>${editing?cellEditor('text',n,data):textDisplay(data.text)}</td><td>${editing?cellEditor('number',n,data):textDisplay(data.number)}</td><td>${editing?imageEditor(n,data):(d.strokes&&d.strokes.length?drawingSvg(d.strokes):'')}</td><td>${editing?`<button id="dataBtn" class="btn primary row-data-btn">DATA!</button>`:scoring?scoreEditor(data):textDisplay(data.score)}</td></tr>`}

function renderWorksheet(force=false){if(state.mode!=='student'||!state.session||!state.group)return;if(state.session.status==='finished'){renderFinal();return}const rows=[1,2,3,4,5,6,7].map(n=>displayRow(n,roundData(n))).join('');view.innerHTML=`<div class="sessionbar"><div class="session-left"><span class="chip session-main">${state.period}교시/${esc((state.group.groupName||'모둠').match(/모둠$/)?state.group.groupName:(state.group.groupName||'')+'모둠')}</span></div><div class="session-center"><span class="chip group-code-chip">모둠 코드: <b>${esc(state.groupCode)}</b></span></div><div class="session-right"><span id="conn" class="conn">연결됨</span><button class="btn subtle" id="resetLocal" style="min-height:32px;padding:5px 9px;font-size:11px">새 모둠 활동</button></div></div><div class="round-banner"><b>${state.session.round-1}라운드</b><span class="hint ${state.session.status==='writing'?'guide':''}">${state.session.status==='writing'?'제시어를 적고, 모둠원이 협력하여 내용을 함께 작성합니다.':'STOP! 점수만 입력할 수 있습니다.'}</span></div><div class="paper-scroll"><div class="paper" id="worksheetPaper">${headerHtml()}<table class="sheet-table">${tableHead()}<tbody>${rows}</tbody></table></div></div>${actionAreaHtml()}`;document.getElementById('resetLocal').onclick=resetLocalOnly;bindCurrentEditors();state.viewReady=true;setConn('연결됨','ok')}
function actionAreaHtml(){const s=state.session,r=state.round||{};if(s.status==='writing')return `<div class="actions"><span class="action-msg" id="actionMsg"></span></div>`;if(s.status==='stopped'){const winner=s.winnerName||s.winnerCode||'';const p=state.scoreProgress||{confirmed:0,total:0,missingGroups:[]};const mine=s.winnerCode===state.groupCode;return `<div class="stop-banner">STOP! 가장 먼저 DATA를 외친 모둠: ${esc(winner)}</div><div class="progress-line">점수 확정 ${p.confirmed||0}/${p.total||0}모둠</div><div class="actions">${mine&&r.scoreConfirmed?`<button class="btn primary" id="advanceBtn">${s.round>=7?'교사 확인 후 활동 마치기':'교사 확인 후 다음 라운드 시작'}</button>`:''}<span class="action-msg" id="actionMsg">${mine?'DATA 모둠은 교사가 확인한 뒤 버튼을 눌러 주세요.':'점수를 확정한 뒤 교사의 다음 안내를 기다려 주세요.'}</span></div>`}return''}

function bindCurrentEditors(){if(state.session.status==='writing'){['prompt','sound','text','number'].forEach(field=>{const el=document.getElementById('f-'+field);if(!el)return;autoResize(el);el.addEventListener('focus',()=>acquireLock(field,el));el.addEventListener('input',()=>{autoResize(el);queueFieldSave(field,el.value)});el.addEventListener('blur',()=>{flushFieldSave(field,el.value);releaseLock(field)});});setupCanvas();const b=document.getElementById('dataBtn');if(b){b.onclick=callData;updateDataButton()}}else if(state.session.status==='stopped'){const el=document.getElementById('scoreInput');if(el){el.addEventListener('focus',()=>acquireLock('score',el));el.addEventListener('input',()=>queueFieldSave('score',el.value));el.addEventListener('blur',()=>releaseLock('score'))}const c=document.getElementById('scoreConfirm');if(c)c.onclick=confirmScore;const a=document.getElementById('advanceBtn');if(a)a.onclick=advanceRound}}
function autoResize(el){el.style.height='auto';el.style.height=Math.max(32,el.scrollHeight)+'px'}
function saveIndicator(field,text,kind=''){const el=document.getElementById('save-'+field);if(el){el.textContent=text;el.className='save-dot '+kind}}
async function acquireLock(field,el){try{const r=await callApi({action:'acquireLock',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId,field},{timeout:6500});if(!r.ok&&r.locked){el.blur();alert(`${r.ownerName||'다른 모둠원'}이(가) 이 칸을 작성 중입니다.`)}}catch{}}
function releaseLock(field){callApi({action:'releaseLock',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId,field},{timeout:4500}).catch(()=>{})}
function queueFieldSave(field,value){clearTimeout(state.debounce[field]);state.dirtyFields[field]=true;state.seq[field]=Number(state.seq[field]||0)+1;const seq=state.seq[field];saveIndicator(field,'저장 중','saving');state.debounce[field]=setTimeout(()=>saveField(field,value,seq),CONFIG.SAVE_DEBOUNCE_MS)}
function flushFieldSave(field,value){state.dirtyFields[field]=true;if(state.debounce[field]){clearTimeout(state.debounce[field]);state.debounce[field]=null;state.seq[field]=Number(state.seq[field]||0)+1}saveField(field,value,state.seq[field])}
async function saveField(field,value,seq,retry=0){try{const r=await callApi({action:'saveField',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId,field,value,seq},{timeout:7000});if(r.ok){if(!r.stale){if(state.round)state.round[field]=value;if(Number(seq)===Number(state.seq[field]))state.dirtyFields[field]=false;saveIndicator(field,'저장됨','saved')}return}if(r.retryable&&retry<1){setTimeout(()=>saveField(field,value,seq,retry+1),450);return}if(r.locked){saveIndicator(field,'다른 모둠원 작성 중','')}}catch{if(retry<1){setTimeout(()=>saveField(field,value,seq,retry+1),500);return}saveIndicator(field,'재연결 중','')}}
function currentComplete(){return ['prompt','sound','text','number'].every(f=>(document.getElementById('f-'+f)?.value||state.round?.[f]||'').trim())&&((state.drawing?.strokes||[]).length>0)}
function updateDataButton(){const b=document.getElementById('dataBtn');if(b)b.disabled=!currentComplete()}

function setupCanvas(){const c=document.getElementById('drawCanvas');if(!c)return;drawStrokesOnCanvas(c,state.drawing?.strokes||[]);let stroke=null,rollback=null;const point=e=>{const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))}};c.addEventListener('pointerdown',e=>{e.preventDefault();rollback=JSON.parse(JSON.stringify(state.drawing.strokes||[]));ensureImageLock().then(ok=>{if(!ok){state.drawing.strokes=rollback||[];redrawCanvas(c);state.drawingPointer=false;stroke=null;pollOnce(true)}});c.setPointerCapture(e.pointerId);state.drawingPointer=true;stroke={points:[point(e)]};state.drawing.strokes=state.drawing.strokes||[];state.drawing.strokes.push(stroke);redrawCanvas(c)});c.addEventListener('pointermove',e=>{if(!state.drawingPointer||!stroke)return;e.preventDefault();const p=point(e),last=stroke.points[stroke.points.length-1];if(!last||Math.hypot(p.x-last.x,p.y-last.y)>=1.1){stroke.points.push(p);redrawCanvas(c)}});const end=e=>{if(!state.drawingPointer)return;e.preventDefault();state.drawingPointer=false;stroke=null;queueDrawingSave();updateDataButton()};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);const clear=document.getElementById('drawClear');if(clear)clear.onclick=async()=>{if(!(await ensureImageLock()))return;state.drawing.strokes=[];redrawCanvas(c);queueDrawingSave();updateDataButton()}}
async function ensureImageLock(){if(Date.now()<state.imageLockUntil)return true;if(state.imageLockPromise)return state.imageLockPromise;state.imageLockPromise=(async()=>{try{const r=await callApi({action:'acquireLock',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId,field:'image'},{timeout:6000});if(r.ok){state.imageLockUntil=Date.now()+15000;return true}if(r.locked)alert(`${r.ownerName||'다른 모둠원'}이(가) 그림을 그리고 있습니다.`)}catch{}return false})().finally(()=>{state.imageLockPromise=null});return state.imageLockPromise}
function redrawCanvas(c){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';(state.drawing?.strokes||[]).forEach(s=>{const pts=s.points||[];if(!pts.length)return;ctx.beginPath();ctx.moveTo(pts[0].x/100*c.width,pts[0].y/100*c.height);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x/100*c.width,pts[i].y/100*c.height);if(pts.length===1)ctx.lineTo(pts[0].x/100*c.width+.2,pts[0].y/100*c.height+.2);ctx.stroke()})}
function drawStrokesOnCanvas(c,strokes){state.drawing={...(state.drawing||{}),strokes:JSON.parse(JSON.stringify(strokes||[]))};redrawCanvas(c)}
function queueDrawingSave(){clearTimeout(state.debounce.image);state.seq.image=Number(state.seq.image||0)+1;const seq=state.seq.image;saveIndicator('image','저장 중','saving');state.debounce.image=setTimeout(()=>saveDrawing(seq),450)}
async function saveDrawing(seq,retry=0){if(!(await ensureImageLock()))return;try{const r=await callApi({action:'saveDrawing',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId,strokes:state.drawing.strokes||[],seq},{timeout:8000});if(r.ok){state.drawing=r.drawing||state.drawing;const n=state.session?.round||0;if(n&&(state.drawing.strokes||[]).length)state.drawingBackup[n]=JSON.parse(JSON.stringify(state.drawing));if(state.round)state.round.imageCompleted=(state.drawing.strokes||[]).length>0;state.imageLockUntil=Date.now()+15000;saveIndicator('image','저장됨','saved');return}if(r.retryable&&retry<1){setTimeout(()=>saveDrawing(seq,retry+1),500)}}catch{if(retry<1)setTimeout(()=>saveDrawing(seq,retry+1),550)}}

async function callData(){const btn=document.getElementById('dataBtn'),msg=document.getElementById('actionMsg');if(!currentComplete()){msg.textContent='빈칸을 모두 작성하고 그림도 그려 주세요.';return}btn.disabled=true;msg.textContent='DATA를 확인하고 있습니다...';const n=state.session?.round||0;if(n&&(state.drawing?.strokes||[]).length)state.drawingBackup[n]=JSON.parse(JSON.stringify(state.drawing));const current={seq:{...state.seq},strokes:state.drawing.strokes||[]};['prompt','sound','text','number'].forEach(f=>current[f]=document.getElementById('f-'+f)?.value||state.round?.[f]||'');try{const r=await callApi({action:'callData',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId,current},{timeout:22000,retries:1});if(!r.ok){msg.textContent=r.message||'DATA를 처리하지 못했습니다.';btn.disabled=false;return}['prompt','sound','text','number'].forEach(f=>state.dirtyFields[f]=false);await pollOnce(true);if(r.sheetWarning)alert('DATA 처리는 완료되었지만 스프레드시트 기록이 지연되었습니다. 같은 라운드에서 DATA 버튼을 다시 누르면 기록을 다시 시도합니다.');else if(r.winner)alert('DATA! 가장 먼저 완료했습니다. 모든 모둠이 STOP 됩니다.');else if(r.alreadyStopped)alert(`${r.winnerName||'다른 모둠'}이(가) 먼저 DATA를 외쳤습니다. STOP!`)}catch{msg.textContent='연결이 잠시 불안정합니다. 다시 눌러 주세요.';btn.disabled=false}}
async function confirmScore(){const input=document.getElementById('scoreInput'),btn=document.getElementById('scoreConfirm'),msg=document.getElementById('actionMsg');const score=(input?.value||'').trim();if(!score){alert('점수를 먼저 입력해 주세요.');return}btn.disabled=true;state.seq.score=Number(state.seq.score||0)+1;try{const r=await callApi({action:'confirmScore',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId,score,seq:state.seq.score},{timeout:12000,retries:1});if(!r.ok){alert(r.message||'점수를 확정하지 못했습니다.');btn.disabled=false;return}if(state.round){state.round.score=score;state.round.scoreConfirmed=true}state.scoreProgress=r.scoreProgress||state.scoreProgress;await loadHistory();renderWorksheet(true);if(r.sheetWarning)alert('점수는 저장됐지만 스프레드시트 표시가 잠시 지연될 수 있습니다.')}catch{alert('연결이 잠시 불안정합니다. 다시 눌러 주세요.');btn.disabled=false}}
async function advanceRound(force=false){const btn=document.getElementById('advanceBtn');if(btn)btn.disabled=true;try{const r=await callApi({action:'advanceRound',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId,force},{timeout:12000,retries:1});if(!r.ok&&r.needConfirm){const names=(r.missingGroups||[]).join(', ');if(confirm(`아직 점수를 확정하지 않은 모둠이 있습니다.\n${names}\n\n교사가 확인했고 그래도 진행하려면 확인을 눌러 주세요.`)){await advanceRound(true)}else if(btn)btn.disabled=false;return}if(!r.ok){alert(r.message||'다음 라운드를 시작하지 못했습니다.');if(btn)btn.disabled=false;return}await loadHistory();await pollOnce(true)}catch{alert('연결이 잠시 불안정합니다. 다시 눌러 주세요.');if(btn)btn.disabled=false}}

function startPolling(){stopPolling();schedulePoll(900)}
function stopPolling(){clearTimeout(state.pollTimer);state.pollTimer=null}
function schedulePoll(ms){clearTimeout(state.pollTimer);if(state.mode==='student')state.pollTimer=setTimeout(()=>pollOnce(false),jitter(ms))}
function pollInterval(){if(!state.session)return CONFIG.POLL_WRITING_MS;if(state.session.status==='writing')return CONFIG.POLL_WRITING_MS;if(state.session.status==='stopped')return CONFIG.POLL_STOPPED_MS;return CONFIG.POLL_FINISHED_MS}
async function pollOnce(force=false){if(state.mode!=='student'||document.hidden||state.pollBusy)return;state.pollBusy=true;try{const r=await callApi({action:'getState',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId},{timeout:8000,retries:force?1:0});if(!r.ok){if(r.invalidSession||r.invalidParticipant){clearLocal();showStart();return}setConn('연결 확인 중','warn');return}const oldRound=state.session?.round,oldStatus=state.session?.status,oldGroupCount=state.group?.members?.length||0,focused=document.activeElement?.dataset?.field||'';const oldDrawingSeq=Number(state.drawing?.seq||0);applyState(r);const structureChanged=force||oldRound!==state.session.round||oldStatus!==state.session.status||oldGroupCount!==(state.group?.members?.length||0);if(structureChanged){await loadHistory();renderWorksheet(true)}else{updateLiveFields(focused,oldDrawingSeq)}setConn('연결됨','ok')}catch{setConn('재연결 중','warn')}finally{state.pollBusy=false;if(state.mode==='student')schedulePoll(pollInterval())}}
function updateLiveFields(focused,oldDrawingSeq){if(!state.viewReady)return;['prompt','sound','text','number'].forEach(f=>{const el=document.getElementById('f-'+f);if(!el||focused===f||state.dirtyFields[f])return;const value=state.round?.[f]??'';if(el.value!==value){el.value=value;autoResize(el)}});const score=document.getElementById('scoreInput');if(score&&document.activeElement!==score&&score.value!==(state.round?.score||''))score.value=state.round?.score||'';if(state.session.status==='writing'){const c=document.getElementById('drawCanvas');if(c&&!state.drawingPointer&&Number(state.drawing.seq||0)!==oldDrawingSeq)redrawCanvas(c);updateDataButton()}if(state.session.status==='stopped'){const p=state.scoreProgress||{confirmed:0,total:0};const line=document.querySelector('.progress-line');if(line)line.textContent=`점수 확정 ${p.confirmed||0}/${p.total||0}모둠`;if(state.session.winnerCode===state.groupCode&&state.round?.scoreConfirmed&&!document.getElementById('advanceBtn'))renderWorksheet(true)}}

document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPolling();else if(state.mode==='student')pollOnce(true)});
function resetLocalOnly(){if(!confirm('이 기기의 현재 모둠 연결만 해제하고 처음 화면으로 돌아갈까요?\n서버에 저장된 모둠과 작성 내용은 삭제되지 않습니다.'))return;stopPolling();clearLocal();Object.keys(state.debounce).forEach(k=>clearTimeout(state.debounce[k]));location.reload()}

async function renderFinal(){stopPolling();const loaded=await loadHistory();if(!loaded){view.innerHTML=`<section class="setup"><h1>최종 활동지를 불러오고 있습니다.</h1><p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p><button class="btn primary" id="retryFinal">다시 불러오기</button></section>`;document.getElementById('retryFinal').onclick=renderFinal;return}const rows=[1,2,3,4,5,6,7].map(n=>displayFinalRow(n,state.history[n]||{})).join('');view.innerHTML=`<div class="sessionbar"><div class="session-left"><span class="chip session-main">${state.period}교시/${esc(((state.group?.groupName||'모둠').match(/모둠$/)?state.group.groupName:(state.group?.groupName||'')+'모둠'))}</span></div><div class="session-center"><span class="chip group-code-chip">모둠 코드: <b>${esc(state.groupCode)}</b></span></div><div class="session-right"><button class="btn subtle" id="resetLocal">새 모둠 활동</button></div></div><div class="final-note">데이터 쁘띠바크 활동이 모두 끝났습니다.</div><div class="paper-scroll"><div class="paper capture-mode" id="finalPaper">${headerHtml()}<table class="sheet-table">${tableHead()}<tbody>${rows}</tbody></table></div></div><div class="actions"><button class="btn primary" id="saveFinal">결과 저장하기</button><span class="action-msg" id="saveMsg"></span></div>`;document.getElementById('resetLocal').onclick=resetLocalOnly;document.getElementById('saveFinal').onclick=saveFinalResult}
function displayFinalRow(n,data){if(n===1)return `<tr class="example-row"><td class="row-no">예시</td><td><div class="cell-text example-cell">의자</div></td><td><div class="cell-text example-cell">드르륵<span class="example-sub">(의자 끄는<br>소리)</span></div></td><td><div class="cell-text example-cell">등받이</div></td><td><div class="cell-text example-cell">4<span class="example-sub">(의자<br>다리 수)</span></div></td><td><img class="example-chair" src="${ASSET.chair}" alt="의자 예시"></td><td><div class="cell-text example-cell">2</div></td></tr>`;const d=data.drawing||{strokes:[]};return `<tr><td class="row-no">${n-1}</td><td>${textDisplay(data.prompt)}</td><td>${textDisplay(data.sound)}</td><td>${textDisplay(data.text)}</td><td>${textDisplay(data.number)}</td><td>${d.strokes&&d.strokes.length?drawingSvg(d.strokes):''}</td><td>${textDisplay(data.score)}</td></tr>`}
async function ensureHtml2Canvas(){if(window.html2canvas)return true;return await new Promise(resolve=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=()=>resolve(!!window.html2canvas);s.onerror=()=>resolve(false);document.head.appendChild(s)})}
async function saveFinalResult(){const btn=document.getElementById('saveFinal'),msg=document.getElementById('saveMsg');btn.disabled=true;msg.textContent='활동지 이미지를 만들고 있습니다...';try{if(!(await ensureHtml2Canvas()))throw new Error('이미지 저장 도구를 불러오지 못했습니다.');const el=document.getElementById('finalPaper');const canvas=await html2canvas(el,{backgroundColor:'#fff',scale:2,useCORS:true,logging:false,width:el.scrollWidth,height:el.scrollHeight,windowWidth:el.scrollWidth,windowHeight:el.scrollHeight});const dataUrl=canvas.toDataURL('image/png');const filename=safeName(`${state.group.school}_${state.group.grade}학년_${state.group.className}반_${state.group.groupName}_7차시_데이터쁘띠바크.png`);const a=document.createElement('a');a.href=dataUrl;a.download=filename;document.body.appendChild(a);a.click();a.remove();msg.textContent='기기에 저장했습니다. Google Drive에 제출하는 중입니다...';const r=await callApi({action:'submitFinal',sessionId:state.sessionId,code:state.groupCode,participantId:state.participantId,imageData:dataUrl},{timeout:30000,retries:1});if(!r.ok)throw new Error(r.message||'Drive 제출에 실패했습니다.');msg.textContent=r.duplicate?'이미 제출된 모둠입니다. 기존 제출 파일을 유지했습니다.':'Google Drive와 활동지 제출목록에 저장했습니다.'}catch(e){msg.textContent=e.message||'저장하지 못했습니다. 다시 시도해 주세요.';btn.disabled=false}}

(async function init(){const saved=loadLocal();if(saved&&apiConfigured())await resumeLocal(saved);else showStart()})();
</script>
